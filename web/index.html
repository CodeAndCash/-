<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f11">
<title>C&amp;C Family</title>
<link rel="icon" href="img/bird.svg?v=1" type="image/svg+xml">
<link rel="preload" href="fonts/Onest.woff?v=1" as="font" type="font/woff" crossorigin>
<script>
  // Тема до отрисовки — чтобы не мигало.
  (function () {
    try {
      var t = localStorage.getItem("cc_theme");
      if (!t) {
        var m = /tgWebAppThemeParams=([^&]+)/.exec(location.hash);
        var bg = m ? (JSON.parse(decodeURIComponent(m[1])).bg_color || "") : "";
        if (bg) t = parseInt(bg.slice(1, 3), 16) > 140 ? "light" : "dark";
      }
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="app.css?v=1.1.0">
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="Загрузка">
  <div class="mark">
    <span class="bird" data-bird></span>
    <b>C&amp;C Family</b>
    <div class="bar"><i></i></div>
  </div>
</div>
<main id="app"></main>
<nav class="nav" id="nav" aria-label="Разделы"></nav>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<script src="icons.js?v=1.1.0"></script>
<script src="app.js?v=1.1.0"></script>
</body>
</html>
