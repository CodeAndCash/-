<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluation C&amp;C</title>
<script>
window.TG_HASH = location.hash;
/* Сразу говорим Telegram «страница готова» — без внешнего скрипта telegram.org.
   Если он не загрузится (бывает на мобильном интернете), Telegram не будет
   бесконечно показывать свою заставку загрузки. */
(function () {
  function post(type, data) {
    var d = JSON.stringify(data || {});
    try {
      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) { window.TelegramWebviewProxy.postEvent(type, d); return; }
      if (window.external && "notify" in window.external) { window.external.notify(JSON.stringify({ eventType: type, eventData: data || {} })); return; }
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) { window.webkit.messageHandlers.performAction.postMessage({ eventType: type, eventData: d }); return; }
      if (window.parent !== window) window.parent.postMessage(JSON.stringify({ eventType: type, eventData: data || {} }), "*");
    } catch (e) {}
  }
  window.tgPost = post;
  post("web_app_ready");
  post("web_app_expand");
})();
window.BOOT_STAGE = "страница";
/* Отметки на сервер: в railway logs видно, где страница застряла на телефоне. */
(function () {
  var id = Math.random().toString(36).slice(2, 8), t0 = Date.now();
  window.PING = function (s) { try { new Image().src = "/eval/api/ping?id=" + id + "&t=" + (Date.now() - t0) + "&s=" + encodeURIComponent(s) + "&r=" + Math.random(); } catch (e) {} };
  PING("страница открылась hash=" + (location.hash.indexOf("tgWebAppData") >= 0 ? "есть" : "нет"));
  document.addEventListener("DOMContentLoaded", function () { PING("DOM готов"); });
  window.addEventListener("load", function () { PING("всё загружено, Telegram " + (window.Telegram ? "есть" : "нет")); });
  document.addEventListener("visibilitychange", function () { PING("видимость " + document.visibilityState); });
  window.addEventListener("unhandledrejection", function (e) { var r = e.reason; PING("НЕОБРАБОТАННАЯ ОШИБКА: " + (r && (r.message + " | " + String(r.stack || "").split("\n").slice(0, 3).join(" < ")) || r)); });
  window.addEventListener("pagehide", function () { PING("страница закрыта/перезагружена"); });
  setTimeout(function () { PING("таймер 3 с работает, шаг: " + window.BOOT_STAGE); }, 3000);
  setTimeout(function () { PING("таймер 10 с работает, шаг: " + window.BOOT_STAGE); }, 10000);
})();
window.onerror = function (msg, src, line) { window.BOOT_ERR = msg + " (" + String(src || "").split("/").pop() + ":" + line + ")"; window.PING && PING("ОШИБКА " + window.BOOT_ERR); };
</script>
<style>
@font-face{font-family:Manrope;src:url(fonts/Manrope.ttf) format("truetype");font-weight:200 800;font-display:swap}
:root{--bg:#151619;--s1:#1d1f23;--s2:#26282d;--s3:#2f3238;--ln:#33363c;--tx:#f3f3f4;--mu:#8d9097;--lo:#5f626a;--inv:#151619;--ok:#3ccf7e;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{font:500 15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--tx)}
.ic{width:20px;height:20px;display:block;flex:none}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo i{width:34px;height:34px;background:var(--tx);-webkit-mask:url(bird.png) center/contain no-repeat;mask:url(bird.png) center/contain no-repeat}
.round{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center}
.round.spin .ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:18px 16px 24px;max-width:640px;margin:0 auto}
.h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.h h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.h small{color:var(--mu);font-size:15px;font-weight:600}
.lead{color:var(--mu);margin:-4px 0 16px}
.label{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 2px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:10px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);font-weight:700;font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.chip b{font-weight:800;opacity:.6;margin-left:4px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.card.tap{display:block;width:100%;text-align:left;transition:border-color .15s}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.meta{color:var(--mu);font-size:13.5px;margin-top:4px}
.pill{flex:none;padding:6px 12px;border-radius:99px;background:var(--tx);color:var(--inv);font-weight:800;font-size:13px;white-space:nowrap}
.pill.ghost{background:transparent;color:var(--mu);border:1px solid var(--ln)}
.pill.dark{background:var(--s3);color:var(--tx)}
.name{font-weight:800;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name span{color:var(--mu);font-weight:600}
.thumbs{display:flex;gap:8px;margin-top:12px;overflow:hidden}
.thumb{position:relative;width:96px;height:150px;border-radius:14px;overflow:hidden;background:var(--s2);border:1px solid var(--ln);flex:none}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:auto 8px 8px auto;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.thumb .play .ic{width:16px;height:16px}
.thumb .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);font-weight:800;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:14px 16px}
.tile small{display:flex;gap:8px;align-items:center;color:var(--mu);font-weight:700;font-size:13px}
.tile small .ic{width:16px;height:16px}
.tile b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.tile.inv{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.tile.inv small{color:#55585f}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--s3);min-height:3px}
.bars i.d{background:var(--tx)}
.bars span{font-size:10.5px;color:var(--lo);font-weight:700}
.legend{display:flex;gap:16px;margin-top:12px;color:var(--mu);font-size:13px;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--s3);margin-right:6px;vertical-align:-1px}
.legend i.d{background:var(--tx)}
input.field,textarea.field{width:100%;padding:13px 15px;border-radius:16px;border:1px solid var(--ln);background:var(--s1);outline:0}
input.field:focus,textarea.field:focus{border-color:var(--mu)}
textarea.field{min-height:96px;resize:vertical;line-height:1.45}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu)}
.search input{padding-left:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 18px;border-radius:16px;border:1px solid var(--ln);background:var(--s1);font-weight:800;font-size:15px;white-space:nowrap}
.btn.main{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--ln))}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.empty .ic{width:40px;height:40px;margin:0 auto 12px;color:var(--lo)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;color:var(--mu);font-size:11.5px;font-weight:700;position:relative}
nav.tabs button.on{color:var(--tx)}
nav.tabs .ic{width:23px;height:23px}
nav.tabs em{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--tx);color:var(--inv);font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mu);font-weight:700;margin-bottom:12px}
.kv{display:grid;gap:10px}
.kv div{display:flex;gap:10px;align-items:flex-start}
.kv .ic{color:var(--mu);margin-top:1px}
.kv a{word-break:break-all}
.comment{white-space:pre-wrap;background:var(--s2);border-radius:14px;padding:12px 14px;margin-top:12px}
.gallery{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.gallery::-webkit-scrollbar{display:none}
.gallery .thumb{width:132px;height:220px}
.gallery .thumb.err{display:grid;place-items:center;text-align:center;padding:10px;color:var(--mu);font-size:12px}
.crit{padding:14px 0;border-top:1px solid var(--ln)}
.crit:first-of-type{border-top:0;padding-top:4px}
.crit .row b{font-size:15.5px}
.crit .val{margin-left:auto;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.crit .val.unset{color:var(--lo)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}
.scale button{height:38px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);font-weight:800;font-size:14px}
.scale button.in{background:var(--s3)}
.scale button.on{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.half{display:flex;gap:8px;margin-top:8px}
.half button{padding:6px 12px;border-radius:99px;border:1px solid var(--ln);font-size:13px;font-weight:700;color:var(--mu)}
.half button.on{color:var(--tx);border-color:var(--tx)}
.total{display:flex;align-items:center;gap:14px;background:var(--tx);color:var(--inv);border-radius:20px;padding:16px 18px;margin:6px 0 14px}
.total b{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.total small{display:block;font-weight:800;font-size:15px}
.total span{display:block;color:#55585f;font-weight:600;font-size:13px}
.fl{display:block;font-weight:800;font-size:14px;margin:14px 2px 8px}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;background:var(--s2);white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--tx);color:var(--inv);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;border-bottom-left-radius:6px}
.msg small{display:block;font-size:11.5px;opacity:.6;margin-top:4px;font-weight:700}
.send{display:flex;gap:8px;align-items:flex-end}
.send textarea{min-height:48px;height:48px}
.send .btn{padding:0;width:50px;height:50px;flex:none}
.preview blockquote{border-left:3px solid var(--mu);padding-left:10px;margin:2px 0}
.preview{white-space:pre-wrap;background:var(--s2);border-radius:16px;padding:14px;font-size:14px;line-height:1.5}
.preview blockquote{border-left:3px solid var(--mu);padding-left:10px;margin:4px 0;color:var(--tx)}
.urow{display:flex;gap:8px;margin-top:12px}
.urow button:disabled{opacity:.4}
.urow button{flex:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:12px;border:1px solid var(--ln);font-weight:800;font-size:13.5px}
.urow .ic{width:17px;height:17px}
.urow .danger{color:var(--bad)}
.counts{display:flex;gap:14px;margin-top:8px;color:var(--mu);font-size:13px;font-weight:700;flex-wrap:wrap}
.counts b{color:var(--tx)}
.tcard .row{gap:12px}
.tcard p{color:var(--mu);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .mark{color:var(--mu);font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;flex:none}
.tcard .mark .ic{width:16px;height:16px}
.rte{border:1px solid var(--ln);border-radius:22px;background:var(--s1);overflow:hidden}
.rte-bar{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--ln);scrollbar-width:thin}
.rte-bar button{flex:none;min-width:42px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);font-weight:700;display:grid;place-items:center}
.rte-bar .ic{width:18px;height:18px}
.rte-ed{min-height:170px;max-height:46vh;overflow:auto;padding:14px 16px;outline:0;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.rte-ed:empty::before{content:attr(data-ph);color:var(--lo)}
.rte-ed blockquote{border-left:3px solid var(--mu);padding-left:10px;margin:2px 0}
.rte-ed code{background:var(--s3);padding:1px 5px;border-radius:6px;font-size:.92em}
.rte-ed .tg-spoiler{background:var(--s3);border-radius:4px}
.rte-foot{display:flex;justify-content:space-between;padding:8px 16px 12px;color:var(--lo);font-size:12.5px;font-weight:700}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.vars button{padding:7px 11px;border-radius:10px;border:1px dashed var(--ln);font-size:13px;font-weight:700;color:var(--mu)}
.vars button b{color:var(--tx);font-weight:800}
.vars.heads{align-items:center}.vars.heads span{font-size:12.5px;font-weight:700;color:var(--lo);margin-right:2px}
.vars.heads button{border-style:solid;color:var(--tx);background:var(--s1)}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.imgs .thumb{width:84px;height:84px}
.imgs .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center}
.imgs .x .ic{width:13px;height:13px}
.addrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.addrow small{color:var(--mu);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--tx);color:var(--inv);font-weight:800;padding:12px 18px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;transition:.25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:flex;flex-direction:column}
.viewer .vt{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:#fff;font-weight:800}
.viewer .vt button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:0 6px 20px}
.viewer img,.viewer video{max-width:100%;max-height:100%;border-radius:10px}
.confirm{background:var(--s2);border-radius:16px;padding:14px;margin-top:12px}
.dots{display:flex;gap:6px;justify-content:center;padding:40px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mu);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
@media(hover:hover){.card.tap:hover{border-color:var(--lo)}.chip:hover:not(.on),.btn:hover:not(.main):not(:disabled),.urow button:hover,.rte-bar button:hover{border-color:var(--mu)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* заметка к пункту */
.field.note{margin-top:10px;min-height:44px;resize:none;font-size:14px;padding:11px 14px;line-height:1.4}
/* вход в предпросмотр */
.pvcard{display:flex!important;align-items:center;gap:14px;margin-bottom:18px}
.pvcard .pvic{width:44px;height:44px;border-radius:14px;background:var(--tx);color:var(--inv);display:grid;place-items:center;flex:none}
.pvcard b{display:block;font-size:16px;font-weight:800}
.pvcard small{display:block;color:var(--mu);font-size:13.5px;margin-top:2px}
.pvcard .fwd{transform:rotate(180deg);color:var(--mu)}
/* чат как в Telegram */
.tg{background:#0e1621;border-radius:22px;padding:14px 10px 18px;margin:0 -6px;display:flex;flex-direction:column;gap:6px;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.025) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.02) 0 2px,transparent 3px);background-size:46px 46px,58px 58px}
.tg-row{display:flex}
.tg-row.me{justify-content:flex-end}
.tg-col{max-width:88%;display:flex;flex-direction:column;gap:4px}
.tg-b{background:#182533;color:#f5f5f5;border-radius:16px 16px 16px 6px;padding:8px 12px 9px;font:400 15px/1.38 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
.tg-b.me{background:#2b5278;border-radius:16px 16px 6px 16px;max-width:80%}
.tg-b.pic{padding:4px}
.tg-text{white-space:pre-wrap}
.tg-text b{font-weight:700}
.tg-text a{color:#6ab3f3;text-decoration:none}
.tg-text code{font:13.5px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#7fc4ff}
.tg-text blockquote{border-left:3px solid #6ab3f3;background:rgba(106,179,243,.1);border-radius:4px 8px 8px 4px;padding:4px 9px;margin:3px 0;white-space:pre-wrap}
.tg-text tg-spoiler,.tg-text .tg-spoiler{background:#3a4a5c;color:transparent;border-radius:4px}
.tg-photo{border-radius:12px;overflow:hidden;background:#22303f;margin:-4px -8px 8px;min-height:120px;display:grid;place-items:center}
.tg-b.pic .tg-photo{margin:0;aspect-ratio:4/5}
.tg-b.pic .tg-text{padding:6px 8px 4px}
.tg-photo img{width:100%;display:block}
.tg-photo.wait img{display:none}
.tg-img{min-height:90px;color:#8aa0b5;gap:6px;font-size:13px;grid-auto-flow:row}
.tg-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:-4px -8px 6px}
.tg-ph i{aspect-ratio:3/4;background:#3c6a96;border-radius:8px;display:grid;place-items:center;color:#a9c7e6}
.tg-kb{display:flex;flex-direction:column;gap:4px}
.tg-kb span{background:rgba(24,37,51,.82);color:#fff;text-align:center;border-radius:10px;padding:9px 10px;font:500 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tg-tap{align-self:center;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);color:#c9d4de;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;margin:4px 0}
.tg-tap .ic{width:15px;height:15px}
.tg-note{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 4px 2px;color:#8aa0b5;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.tg-note button{color:#6ab3f3;font-weight:800;font-size:12.5px;padding:4px 2px;flex:none}
</style>
</head>
<body>
<header class="top"><div class="logo"><i aria-hidden="true"></i><span>Evaluation C&amp;C</span></div>
<button class="round" id="refresh" aria-label="Обновить"></button></header>
<main id="app"><div class="dots"><i></i><i></i><i></i></div><p id="bootInfo" style="text-align:center;color:#5f626a;font-size:12px;margin-top:6px">v10 · открываем…</p></main>
<script>
/* Если через 20 секунд всё ещё загрузка — показываем, на каком шаге застряло (счётчик секунд остаётся). */
setTimeout(function () {
  var app = document.getElementById("app");
  if (!app || !app.querySelector(".dots") || window.BOOT_DONE) return;
  var why = window.BOOT_ERR ? "Ошибка: " + window.BOOT_ERR : "Шаг: " + window.BOOT_STAGE;
  var box = document.createElement("div");
  box.className = "empty";
  box.innerHTML = "<p><b>Долго загружается</b></p><p>Сервер не ответил. Проверь интернет: попробуй через Wi‑Fi или VPN.</p>" +
    '<p class="meta" style="font-size:12px"></p><div class="btns" style="justify-content:center"><button class="btn" onclick="location.reload()">Обновить</button></div>';
  box.querySelector(".meta").textContent = "v10 · " + why;
  var info = document.getElementById("bootInfo2");
  app.innerHTML = ""; app.appendChild(box); if (info) app.appendChild(info);
}, 20000);
</script>
<nav class="tabs" id="tabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<!-- скрипт Telegram грузим асинхронно: если telegram.org тормозит, мини-апп всё равно откроется -->
<script async src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="icons.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
